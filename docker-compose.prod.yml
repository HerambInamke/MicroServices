# Production override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Only Caddy publishes ports (80/443); everything else is reachable only inside provenance_net.
# Compose merges `ports` lists, so `!reset []` (Compose >= 2.24) is needed to drop the dev mappings.
# Secrets have no defaults here: compose refuses to start until they are set in .env.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the public hostname, e.g. provenance.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
    networks:
      - provenance_net

  zookeeper:
    ports: !reset []

  kafka:
    ports: !reset []

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    ports: !reset []
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    volumes:
      - minio_data:/data

  anvil:
    ports: !reset []

  immudb:
    ports: !reset []
    environment:
      # Applied when immudb initialises its data; FORCE also resets it on existing data at every start.
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_PASSWORD:?set IMMUDB_PASSWORD in .env}
      IMMUDB_FORCE_ADMIN_PASSWORD: "true"
    volumes:
      - immudb_data:/var/lib/immudb

  clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  redis:
    volumes:
      - redis_data:/data

  elasticsearch:
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  weaviate:
    volumes:
      - weaviate_data:/var/lib/weaviate

  api-gateway:
    ports: !reset []
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      # Only Caddy reaches the gateway here, so its X-Forwarded-For is trusted for per-client rate limits.
      - TRUST_PROXY=1

  auth-identity:
    environment:
      - DB_URL=postgres://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/auth_db?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

  business-profile:
    environment:
      - MONGO_URL=mongodb://root:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongodb:27017/business_profiles?authSource=admin

  wholesale-catalog:
    environment:
      - DB_PASS=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  order-payment:
    environment:
      - DB_URL=postgresql+psycopg://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/order_db

  media-upload:
    environment:
      - DB_URL=postgres://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/media_db?sslmode=disable
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}

  provenance-ledger:
    environment:
      IMMUDB_PASSWORD: ${IMMUDB_PASSWORD:?set IMMUDB_PASSWORD in .env}

  qr-verification:
    environment:
      - DB_URL=postgres://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/qr_db?sslmode=disable
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to https://<DOMAIN>}

  chat:
    environment:
      - MONGO_URL=mongodb://root:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongodb:27017/chat?authSource=admin

  reviews:
    environment:
      - MONGO_URL=mongodb://root:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongodb:27017/reviews?authSource=admin

  analytics:
    environment:
      - CLICKHOUSE_URL=clickhouse://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@clickhouse:8123/default

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  immudb_data:
  clickhouse_data:
  redis_data:
  elasticsearch_data:
  weaviate_data:
  caddy_data:
  caddy_config:
