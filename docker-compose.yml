# Local development stack. Only the API gateway is published to the host: downstream
# services trust the X-User-* identity headers the gateway sets, so they must not be
# reachable directly. Infra ports are published for local debugging tools.
# All credentials below are dev-only placeholders.

x-app: &app
  restart: unless-stopped
  networks:
    - provenance_net

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - provenance_net
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - provenance_net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "root"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - provenance_net

  mongodb:
    image: mongo:6-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - provenance_net

  minio:
    # minio/minio is no longer published on Docker Hub; chainguard ships the same server.
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - provenance_net

  anvil:
    # Local EVM chain. Default mnemonic, so account 0 (the relayer) and the contract address are
    # deterministic; --state keeps the chain across restarts so it stays in step with immudb.
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    entrypoint: ["anvil", "--host", "0.0.0.0", "--state", "/home/foundry/anvil-state.json"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - provenance_net

  contract-deploy:
    build:
      context: ./contracts
    environment: &chain
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://anvil:8545}
      # Anvil's well-known dev account 0. Never use this key on a real network.
      RELAYER_KEY: ${RELAYER_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
    depends_on:
      anvil:
        condition: service_healthy
    networks:
      - provenance_net

  immudb:
    image: codenotary/immudb:1.9.5
    ports:
      - "3322:3322"
    networks:
      - provenance_net

  api-gateway:
    <<: *app
    build:
      context: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=dev-only-change-me
      - AUTH_URL=http://auth-identity:8081
      - PROFILE_URL=http://business-profile:8082
      - CATALOG_URL=http://wholesale-catalog:8083
      - ORDER_URL=http://order-payment:8084
      - MEDIA_URL=http://media-upload:8085
      - LEDGER_URL=http://provenance-ledger:8086
      - QR_URL=http://qr-verification:8087
      - COUNTERFEIT_URL=http://counterfeit-detection:8088
      - SEARCH_URL=http://search:8089
      - INVENTORY_URL=http://inventory-sync:8090
      - ANALYTICS_URL=http://analytics:8091
    depends_on:
      - auth-identity
      - business-profile
      - wholesale-catalog
      - order-payment
      - media-upload
      - provenance-ledger
      - qr-verification
      - counterfeit-detection
      - search
      - inventory-sync
      - analytics

  auth-identity:
    <<: *app
    build:
      context: ./services/auth-identity
    environment:
      - PORT=8081
      - DB_URL=postgres://root:rootpassword@postgres:5432/auth_db?sslmode=disable
      - JWT_SECRET=dev-only-change-me
      - ADMIN_EMAIL=admin@provenance.local
      - ADMIN_PASSWORD=admin-dev-password
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  business-profile:
    <<: *app
    build:
      context: ./services/business-profile
    environment:
      - PORT=8082
      - MONGO_URL=mongodb://root:rootpassword@mongodb:27017/business_profiles?authSource=admin
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy

  wholesale-catalog:
    <<: *app
    build:
      context: ./services/wholesale-catalog
    environment:
      - PORT=8083
      - DB_URL=jdbc:postgresql://postgres:5432/catalog_db
      - DB_USER=root
      - DB_PASS=rootpassword
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  order-payment:
    <<: *app
    build:
      context: ./services/order-payment
    environment:
      - PORT=8084
      - DB_URL=postgresql+psycopg://root:rootpassword@postgres:5432/order_db
      - KAFKA_BROKERS=kafka:9092
      - CATALOG_URL=http://wholesale-catalog:8083
      - INVENTORY_URL=http://inventory-sync:8090
      # Razorpay test-mode credentials; payments return 503 until these are set (see .env.example).
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  media-upload:
    <<: *app
    build:
      context: ./services/media-upload
    environment:
      - PORT=8085
      - DB_URL=postgres://root:rootpassword@postgres:5432/media_db?sslmode=disable
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=root
      - MINIO_SECRET_KEY=rootpassword
      - MINIO_BUCKET=media
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  provenance-ledger:
    <<: *app
    build:
      context: ./services/provenance-ledger
    environment:
      <<: *chain
      PORT: 8086
      IMMUDB_HOST: immudb
      IMMUDB_USER: immudb
      IMMUDB_PASSWORD: immudb
      IMMUDB_DB: defaultdb
      KAFKA_BROKERS: kafka:9092
      AUTH_URL: http://auth-identity:8081
    depends_on:
      immudb:
        condition: service_started
      kafka:
        condition: service_healthy
      contract-deploy:
        condition: service_completed_successfully
      auth-identity:
        condition: service_started

  qr-verification:
    <<: *app
    build:
      context: ./services/qr-verification
    environment:
      - PORT=8087
      - DB_URL=postgres://root:rootpassword@postgres:5432/qr_db?sslmode=disable
      - LEDGER_URL=http://provenance-ledger:8086
      - KAFKA_BROKERS=kafka:9092
      # Origin encoded into printed QR codes; set to the public gateway URL outside local dev.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      provenance-ledger:
        condition: service_started

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.26.6
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: node1
    networks:
      - provenance_net

  counterfeit-detection:
    <<: *app
    build:
      context: ./services/counterfeit-detection
    environment:
      - PORT=8088
      - WEAVIATE_URL=http://weaviate:8080
      - CATALOG_URL=http://wholesale-catalog:8083
      - MEDIA_URL=http://media-upload:8085
      # Empty uses the calibrated default in app.py.
      - MATCH_THRESHOLD=${MATCH_THRESHOLD:-}
    depends_on:
      - weaviate
      - wholesale-catalog
      - media-upload

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - provenance_net

  search:
    <<: *app
    build:
      context: ./services/search
    environment:
      - PORT=8089
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BROKERS=kafka:9092
      - CATALOG_URL=http://wholesale-catalog:8083
      - PROFILE_URL=http://business-profile:8082
      - COUNTERFEIT_URL=http://counterfeit-detection:8088
    depends_on:
      - elasticsearch
      - kafka

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - provenance_net

  notifications:
    <<: *app
    build:
      context: ./services/notifications
    environment:
      - PORT=8092
      - REDIS_URL=redis://redis:6379/1
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  chat:
    <<: *app
    build:
      context: ./services/chat
    environment:
      - PORT=8093
      - MONGO_URL=mongodb://root:rootpassword@mongodb:27017/chat?authSource=admin
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BROKERS=kafka:9092
      - AUTH_URL=http://auth-identity:8081
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      auth-identity:
        condition: service_started

  inventory-sync:
    <<: *app
    build:
      context: ./services/inventory-sync
    environment:
      - PORT=8090
      - REDIS_URL=redis://redis:6379/0
      - CATALOG_URL=http://wholesale-catalog:8083
    depends_on:
      - redis

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhousepassword
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - provenance_net

  analytics:
    <<: *app
    build:
      context: ./services/analytics
    environment:
      - PORT=8091
      - CLICKHOUSE_URL=clickhouse://default:clickhousepassword@clickhouse:8123/default
      - KAFKA_BROKERS=kafka:9092
      - CATALOG_URL=http://wholesale-catalog:8083
    depends_on:
      - clickhouse
      - kafka

networks:
  provenance_net:
    driver: bridge
