# Local development stack. Only the API gateway is published to the host: downstream
# services trust the X-User-* identity headers the gateway sets, so they must not be
# reachable directly. Infra ports are published for local debugging tools.
# All credentials below are dev-only placeholders.

x-app: &app
  restart: unless-stopped
  networks:
    - provenance_net

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - provenance_net
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - provenance_net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "root"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - provenance_net

  mongodb:
    image: mongo:6-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - provenance_net

  minio:
    # minio/minio is no longer published on Docker Hub; chainguard ships the same server.
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - provenance_net

  api-gateway:
    <<: *app
    build:
      context: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=dev-only-change-me
      - AUTH_URL=http://auth-identity:8081
      - PROFILE_URL=http://business-profile:8082
      - CATALOG_URL=http://wholesale-catalog:8083
      - ORDER_URL=http://order-payment:8084
      - MEDIA_URL=http://media-upload:8085
    depends_on:
      - auth-identity
      - business-profile
      - wholesale-catalog
      - order-payment
      - media-upload

  auth-identity:
    <<: *app
    build:
      context: ./services/auth-identity
    environment:
      - PORT=8081
      - DB_URL=postgres://root:rootpassword@postgres:5432/auth_db?sslmode=disable
      - JWT_SECRET=dev-only-change-me
      - ADMIN_EMAIL=admin@provenance.local
      - ADMIN_PASSWORD=admin-dev-password
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  business-profile:
    <<: *app
    build:
      context: ./services/business-profile
    environment:
      - PORT=8082
      - MONGO_URL=mongodb://root:rootpassword@mongodb:27017/business_profiles?authSource=admin
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy

  wholesale-catalog:
    <<: *app
    build:
      context: ./services/wholesale-catalog
    environment:
      - PORT=8083
      - DB_URL=jdbc:postgresql://postgres:5432/catalog_db
      - DB_USER=root
      - DB_PASS=rootpassword
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  order-payment:
    <<: *app
    build:
      context: ./services/order-payment
    environment:
      - PORT=8084
      - DB_URL=postgresql+psycopg://root:rootpassword@postgres:5432/order_db
      - KAFKA_BROKERS=kafka:9092
      - CATALOG_URL=http://wholesale-catalog:8083
      # Razorpay test-mode credentials; payments return 503 until these are set (see .env.example).
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  media-upload:
    <<: *app
    build:
      context: ./services/media-upload
    environment:
      - PORT=8085
      - DB_URL=postgres://root:rootpassword@postgres:5432/media_db?sslmode=disable
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=root
      - MINIO_SECRET_KEY=rootpassword
      - MINIO_BUCKET=media
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

networks:
  provenance_net:
    driver: bridge
